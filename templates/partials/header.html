<header class="site-header">
  <div class="container site-header__inner">
    <a class="logo" href="{% url 'polls:feed' %}" aria-label="kararsızım, ana sayfa">kararsızım<span class="logo__q" aria-hidden="true">?</span></a>
    <nav class="site-nav" aria-label="Ana menü">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'accounts:settings' %}">@{{ user.username }}</a>
        <form class="inline-form" method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn--ghost">Çıkış</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'accounts:login' %}">Giriş yap</a>
        <a class="btn btn--primary" href="{% url 'accounts:signup' %}">Kayıt ol</a>
      {% endif %}
    </nav>
  </div>
</header>
