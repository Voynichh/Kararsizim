{% load humanize %}<article class="card poll-card">
  <p class="poll-card__meta">@{{ poll.author.username }} · <time datetime="{{ poll.created_at|date:'c' }}">{{ poll.created_at|naturaltime }}</time></p>
  <h2 class="poll-card__question">
    {% if link %}<a href="{% url 'polls:detail' poll.pk %}">{{ poll.question }}</a>{% else %}{{ poll.question }}{% endif %}
  </h2>
  <ul class="option-list">
    {% for option in poll.options.all %}
    <li class="option">{{ option.text }}</li>
    {% endfor %}
  </ul>
</article>
