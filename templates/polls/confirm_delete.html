{% extends "base.html" %}

{% block title %}Anketi sil — kararsızım{% endblock %}

{% block content %}
<section class="card danger-zone">
  <h1 class="page-title">Anketi silmek üzeresin</h1>
  <p>Aşağıdaki anket ve ona verilen tüm oylar <strong>kalıcı olarak</strong> silinir. Bu işlem geri alınamaz.</p>

  {% include "partials/poll_card.html" %}

  <form method="post" class="stack">
    {% csrf_token %}
    <button type="submit" class="btn btn--danger btn--block">Anketi kalıcı olarak sil</button>
    <a class="btn btn--block" href="{% url 'polls:detail' poll.pk %}">Vazgeç</a>
  </form>
</section>
{% endblock %}
